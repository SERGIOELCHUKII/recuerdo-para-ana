<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Para Ana ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #02030a;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   CIELO
========================= */

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(42, 48, 100, 0.30) 0%,
            rgba(12, 16, 42, 0.18) 35%,
            transparent 65%
        ),
        radial-gradient(
            ellipse at 20% 10%,
            rgba(72, 55, 105, 0.16),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #010208 0%,
            #030615 48%,
            #010208 100%
        );
}

/* ligera niebla */

.sky::before {
    content: "";
    position: absolute;
    inset: -20%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,0.035),
            transparent 55%
        );

    filter: blur(45px);

    animation: atmosphere 12s ease-in-out infinite alternate;
}

@keyframes atmosphere {
    from {
        transform: translate(-2%, -1%) scale(1);
    }

    to {
        transform: translate(2%, 2%) scale(1.05);
    }
}

/* =========================
   ESTRELLAS
========================= */

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;
    background: #fff;

    opacity: 0.5;

    animation:
        twinkle var(--duration) ease-in-out infinite;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: 0.15;
        transform: scale(0.7);
    }

    50% {
        opacity: 0.95;
        transform: scale(1.35);
    }
}

/* =========================
   ESTRELLAS IMPORTANTES
========================= */

.special-star {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px rgba(255,255,255,0.8),
        0 0 22px rgba(255,255,255,0.45);

    animation:
        specialTwinkle 4s ease-in-out infinite;
}

.special-star::before,
.special-star::after {
    content: "";
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: rgba(255,255,255,0.45);
}

.special-star::before {
    width: 30px;
    height: 1px;
}

.special-star::after {
    width: 1px;
    height: 30px;
}

@keyframes specialTwinkle {

    0%,
    100% {
        opacity: 0.25;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* posiciones */

.star-1 {
    top: 17%;
    left: 22%;
}

.star-2 {
    top: 29%;
    left: 78%;
    animation-delay: 1.3s;
}

.star-3 {
    top: 72%;
    left: 16%;
    animation-delay: 2s;
}

.star-4 {
    top: 78%;
    left: 84%;
    animation-delay: 0.7s;
}

/* =========================
   CONTENIDO
========================= */

.main {
    position: relative;
    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
}

.content {
    width: min(90vw, 650px);

    text-align: center;

    animation: contentAppear 2s cubic-bezier(.2,.7,.2,1);
}

@keyframes contentAppear {

    from {
        opacity: 0;
        transform: translateY(28px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   CORAZÓN
========================= */

.heart {
    font-size: clamp(28px, 4vw, 38px);

    margin-bottom: clamp(18px, 3vh, 28px);

    filter:
        drop-shadow(
            0 0 14px rgba(255, 150, 175, 0.35)
        );

    animation: heartbeat 3s ease-in-out infinite;
}

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

/* =========================
   TITULO
========================= */

.title {
    font-size: clamp(42px, 7vw, 72px);

    font-weight: normal;

    letter-spacing: 1px;

    margin-bottom: clamp(14px, 2vh, 22px);

    text-shadow:
        0 0 20px rgba(255,255,255,0.08);
}

/* =========================
   FRASE
========================= */

.subtitle {
    max-width: 510px;

    margin: 0 auto;

    color: rgba(255,255,255,0.72);

    font-size: clamp(17px, 2.5vw, 22px);

    line-height: 1.75;

    font-style: italic;

    margin-bottom: clamp(32px, 6vh, 52px);
}

/* =========================
   BOTÓN
========================= */

.button-container {
    position: relative;

    display: inline-block;
}

.button-glow {
    position: absolute;

    inset: -12px;

    border-radius: 999px;

    background:
        radial-gradient(
            ellipse,
            rgba(255,205,180,0.16),
            transparent 70%
        );

    filter: blur(12px);

    opacity: 0.7;

    animation: buttonGlow 3s ease-in-out infinite;
}

@keyframes buttonGlow {

    0%,
    100% {
        opacity: 0.4;
        transform: scale(0.95);
    }

    50% {
        opacity: 0.8;
        transform: scale(1.04);
    }
}

.button {
    position: relative;
    z-index: 2;

    min-width: 230px;

    padding: 17px 30px;

    border-radius: 999px;

    border: 1px solid rgba(255,220,200,0.55);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.025)
        );

    color: white;

    font-family: Georgia, serif;

    font-size: 13px;

    letter-spacing: 2.5px;

    cursor: pointer;

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);

    transition:
        transform .35s ease,
        border-color .35s ease,
        background .35s ease,
        box-shadow .35s ease;
}

.button:hover {

    transform: translateY(-3px);

    border-color: rgba(255,225,210,0.9);

    background:
        rgba(255,255,255,0.09);

    box-shadow:
        0 8px 35px rgba(0,0,0,0.35),
        0 0 25px rgba(255,200,170,0.08);
}

.button:active {
    transform: scale(.97);
}

/* =========================
   INDICADOR INFERIOR
========================= */

.hint {
    margin-top: 30px;

    font-size: 11px;

    letter-spacing: 2px;

    color: rgba(255,255,255,0.3);

    text-transform: uppercase;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    .content {
        width: min(88vw, 500px);
    }

    .title {
        font-size: clamp(42px, 13vw, 60px);
    }

    .subtitle {
        font-size: 17px;
        line-height: 1.7;
        padding: 0 8px;
    }

    .button {
        min-width: 215px;
        padding: 16px 25px;
    }

    .hint {
        margin-top: 25px;
    }
}

/* tablets */

@media (min-width: 601px) and (max-width: 1100px) {

    .content {
        width: 75vw;
    }
}

/* pantallas muy altas */

@media (min-height: 850px) {

    .content {
        transform: translateY(-2vh);
    }
}

/* reducir animaciones si el dispositivo lo solicita */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>


<body>

<!-- =========================
     CIELO
========================= -->

<div class="sky">

    <div class="stars" id="stars"></div>

    <div class="special-star star-1"></div>
    <div class="special-star star-2"></div>
    <div class="special-star star-3"></div>
    <div class="special-star star-4"></div>

</div>


<!-- =========================
     CONTENIDO
========================= -->

<main class="main">

    <div class="content">

        <div class="heart">
            ❤️
        </div>

        <h1 class="title">
            Para Ana
        </h1>

        <p class="subtitle">
            Hay recuerdos que el tiempo
            nunca consigue borrar.
        </p>

        <div class="button-container">

            <div class="button-glow"></div>

            <button
                class="button"
                onclick="openMemory()"
            >
                ABRIR RECUERDO ❤️
            </button>

        </div>

        <div class="hint">
            Un recuerdo para siempre
        </div>

    </div>

</main>


<script>

/* =========================
   GENERAR ESTRELLAS
========================= */

const stars =
    document.getElementById("stars");

const numberOfStars =
    window.innerWidth < 600
        ? 90
        : 160;

for (
    let i = 0;
    i < numberOfStars;
    i++
) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    const size =
        Math.random() < 0.8
            ? Math.random() * 1.5 + 0.5
            : Math.random() * 2 + 1;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.setProperty(
        "--duration",
        (Math.random() * 4 + 3) + "s"
    );

    star.style.animationDelay =
        (Math.random() * 5) + "s";

    stars.appendChild(star);
}


/* =========================
   ABRIR RECUERDO
========================= */

function openMemory() {

    /*
        ESTA FUNCIÓN LA USAREMOS
        PARA ABRIR LA PANTALLA
        DE CONTRASEÑA.

        Después añadiremos aquí
        la transición cinematográfica.
    */

    alert("Aquí aparecerá la pantalla de contraseña ❤️");

}

</script>

</body>
</html>
